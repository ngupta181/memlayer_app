<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MemLayer - Register</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            max-width: 500px;
            width: 100%;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: white;
            font-size: 2.5rem;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }

        .header h1 i {
            color: #fbbf24;
        }

        .header p {
            color: rgba(255, 255, 255, 0.9);
            font-size: 1.1rem;
        }

        .form-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #4a5568;
            font-weight: 600;
            font-size: 0.95rem;
        }

        .form-group input {
            width: 100%;
            padding: 15px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 16px;
            transition: all 0.3s ease;
            background: white;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
            transform: translateY(-2px);
        }

        .password-input {
            position: relative;
        }

        .toggle-visibility {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #718096;
            cursor: pointer;
            font-size: 16px;
            transition: color 0.3s ease;
        }

        .toggle-visibility:hover {
            color: #667eea;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 16px 32px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s ease;
            width: 100%;
            margin-bottom: 20px;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.3);
        }

        .btn:active {
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: linear-gradient(135deg, #718096 0%, #4a5568 100%);
        }

        .btn-secondary:hover {
            box-shadow: 0 10px 30px rgba(113, 128, 150, 0.3);
        }

        .nav-links {
            text-align: center;
            margin-top: 20px;
        }

        .nav-links a {
            color: #667eea;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .nav-links a:hover {
            color: #764ba2;
        }

        .success-message {
            background: #c6f6d5;
            color: #2f855a;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            text-align: center;
        }

        .success-message h3 {
            margin-bottom: 15px;
            color: #2f855a;
        }

        .warning {
            background: #fed7d7;
            color: #c53030;
            padding: 15px;
            border-radius: 8px;
            margin: 15px 0;
            text-align: center;
            font-weight: 500;
        }

        .error {
            background: #fed7d7;
            color: #c53030;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
        }

        .password-requirements {
            background: #e6fffa;
            color: #2c7a7b;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 0.9rem;
        }

        .password-requirements ul {
            margin: 10px 0;
            padding-left: 20px;
        }

        @media (max-width: 600px) {
            .container {
                padding: 15px;
            }
            
            .form-container {
                padding: 30px 20px;
            }
            
            .header h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1><i class="fas fa-brain"></i> MemLayer</h1>
            <p>Create your account and start managing memories</p>
        </div>

        <div class="form-container">
            <div class="password-requirements">
                <i class="fas fa-info-circle"></i>
                <strong>Password Requirements:</strong>
                <ul>
                    <li>At least 6 characters long</li>
                    <li>Use a combination of letters, numbers, and symbols</li>
                </ul>
            </div>

            <form id="registrationForm">
                <div class="form-group">
                    <label for="userName">
                        <i class="fas fa-user"></i> Full Name
                    </label>
                    <input 
                        type="text" 
                        id="userName" 
                        placeholder="Enter your full name" 
                        required
                        autocomplete="name"
                    >
                </div>

                <div class="form-group">
                    <label for="userEmail">
                        <i class="fas fa-envelope"></i> Email Address
                    </label>
                    <input 
                        type="email" 
                        id="userEmail" 
                        placeholder="Enter your email address" 
                        required
                        autocomplete="email"
                    >
                </div>

                <div class="form-group password-input">
                    <label for="userPassword">
                        <i class="fas fa-lock"></i> Password
                    </label>
                    <input 
                        type="password" 
                        id="userPassword" 
                        placeholder="Enter your password" 
                        required
                        autocomplete="new-password"
                        minlength="6"
                    >
                    <button type="button" class="toggle-visibility" onclick="togglePasswordVisibility()">
                        <i class="fas fa-eye" id="passwordVisibilityIcon"></i>
                    </button>
                </div>

                <div class="form-group password-input">
                    <label for="confirmPassword">
                        <i class="fas fa-lock"></i> Confirm Password
                    </label>
                    <input 
                        type="password" 
                        id="confirmPassword" 
                        placeholder="Confirm your password" 
                        required
                        autocomplete="new-password"
                        minlength="6"
                    >
                    <button type="button" class="toggle-visibility" onclick="toggleConfirmPasswordVisibility()">
                        <i class="fas fa-eye" id="confirmPasswordVisibilityIcon"></i>
                    </button>
                </div>

                <button type="submit" class="btn">
                    <i class="fas fa-user-plus"></i> Create Account
                </button>
            </form>

            <div id="registrationResult"></div>

            <div class="nav-links">
                <p>Already have an account? <a href="login.html">Sign in here</a></p>
                <p>Or go back to <a href="landing.html">Home</a></p>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('registrationForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const userName = document.getElementById('userName').value.trim();
            const userEmail = document.getElementById('userEmail').value.trim();
            const userPassword = document.getElementById('userPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            
            if (!userName || !userEmail || !userPassword || !confirmPassword) {
                showMessage('Please fill in all fields', 'error');
                return;
            }

            if (userPassword.length < 6) {
                showMessage('Password must be at least 6 characters long', 'error');
                return;
            }

            if (userPassword !== confirmPassword) {
                showMessage('Passwords do not match', 'error');
                return;
            }

            try {
                const response = await fetch('/users/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ 
                        name: userName,
                        email: userEmail,
                        password: userPassword
                    })
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    showMessage(`Registration failed: ${errorData.detail || 'Unknown error'}`, 'error');
                    return;
                }

                const result = await response.json();
                showRegistrationSuccess(result);
                
                // Clear the form
                document.getElementById('registrationForm').reset();
                
            } catch (error) {
                console.error('Error registering user:', error);
                showMessage('Error registering user. Please check your server connection.', 'error');
            }
        });

        function showRegistrationSuccess(result) {
            const resultDiv = document.getElementById('registrationResult');
            resultDiv.innerHTML = `
                <div class="success-message">
                    <h3><i class="fas fa-check-circle"></i> Account Created Successfully!</h3>
                    <p><strong>Welcome, ${result.name}!</strong></p>
                    <p>Your account has been created and you can now start using MemLayer.</p>
                    
                    <div class="warning">
                        <i class="fas fa-exclamation-triangle"></i>
                        <strong>Important:</strong> Please sign in with your email and password to access your account.
                    </div>
                    
                    <p>You can now:</p>
                    <ul style="text-align: left; margin: 15px 0; padding-left: 20px;">
                        <li>Sign in with your email and password</li>
                        <li>Store and manage your memories</li>
                        <li>Create relationships between memories</li>
                        <li>Visualize your knowledge graph</li>
                    </ul>
                    
                    <div style="margin-top: 20px;">
                        <a href="login.html" class="btn btn-secondary">
                            <i class="fas fa-sign-in-alt"></i> Go to Login
                        </a>
                    </div>
                </div>
            `;
        }

        function togglePasswordVisibility() {
            const input = document.getElementById('userPassword');
            const icon = document.getElementById('passwordVisibilityIcon');
            
            if (input.type === 'password') {
                input.type = 'text';
                icon.className = 'fas fa-eye-slash';
                icon.title = 'Hide Password';
            } else {
                input.type = 'password';
                icon.className = 'fas fa-eye';
                icon.title = 'Show Password';
            }
        }

        function toggleConfirmPasswordVisibility() {
            const input = document.getElementById('confirmPassword');
            const icon = document.getElementById('confirmPasswordVisibilityIcon');
            
            if (input.type === 'password') {
                input.type = 'text';
                icon.className = 'fas fa-eye-slash';
                icon.title = 'Hide Password';
            } else {
                input.type = 'password';
                icon.className = 'fas fa-eye';
                icon.title = 'Show Password';
            }
        }

        function showMessage(message, type) {
            const messageDiv = document.createElement('div');
            messageDiv.className = type;
            messageDiv.textContent = message;
            
            const container = document.querySelector('.form-container');
            container.insertBefore(messageDiv, container.firstChild);
            
            setTimeout(() => {
                messageDiv.remove();
            }, 5000);
        }
    </script>
</body>
</html>
